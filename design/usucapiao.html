  Fonte da LP servida em /usucapiao, no mesmo formato das exportações da
  ferramenta de design (bloco __bundler/template com o HTML, bloco
  __bundler/manifest com os assets em base64): é o que
  scripts/montar-paginas-design.mjs consome.

  Origem: clone da página /usucapiao/ do WordPress, extraída do arquivo
  "Usucapião - NCM Advogados.htm" (save completo, 20/08/2026). O conteúdo é o
  da página original; o que mudou na extração foi só o que era específico do
  WordPress:

    - saiu o snippet do GTM (GTM-WJ7QQM9L) e o iframe noscript dele — quem
      cuida de medição no site novo é public/assets/ncm-tag.js, injetado pelo
      pipeline, e o GTM anulava o Consent Mode (ver README, passo 1 do deploy);
    - saíram os restos do WP Rocket (lazyload de background) e o bloco
      "ELEMENTOR OVERRIDE" do CSS, que existia para furar o container do
      Elementor com width:100vw — fora do WordPress isso só causava overflow
      horizontal do tamanho de uma barra de rolagem. No lugar entrou
      scroll-margin-top, que a página precisava de verdade: a topbar é sticky
      e escondia o título da seção quando se chegava por âncora;
    - `html, body { overflow-x: hidden }` virou `overflow-x: clip`. Com hidden,
      o body passa a ser contexto de rolagem e o `position: sticky` da topbar
      se ancora nele — que não rola —, então a topbar (e o botão de WhatsApp
      dela) sumia ao descer a página. Conferido no navegador: com clip ela
      gruda no topo e o estouro horizontal continua em zero;
    - as três imagens saíram de data: URI para o manifest, então a página não
      carrega mais 270KB de base64 no HTML e os assets ficam cacheáveis. Com
      isso caiu também a injeção de src por JS, que era contorno do
      sanitizador do WordPress;
    - a folha do Google Fonts voltou a apontar para o CDN (o save tinha uma
      cópia local dentro da pasta _files);
    - o `visible` que o IntersectionObserver havia gravado nas seções acima da
      dobra no momento do save foi removido.

  Os desvios de CONTEÚDO em relação ao WordPress não estão aqui: estão em
  scripts/ajustes-lp-usucapiao.mjs, para ficarem auditáveis um por um.

<script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Advogado Especialista em Usucapião | NCM Advogados<\u002Ftitle>\n<meta name=\"description\" content=\"Especialistas em usucapião e regularização de imóveis. Atendimento para todo o Centro-Sul do Brasil. Fale agora com um advogado e entenda seu direito.\">\n<meta property=\"og:title\" content=\"Advogado Especialista em Usucapião | NCM Advogados\">\n<meta property=\"og:description\" content=\"Regularize seu imóvel pela via legal. Atendimento especializado em usucapião rural, urbana e de inventário.\">\n<meta property=\"og:type\" content=\"website\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ===================== RESET ===================== */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nhtml, body { overflow-x: clip; width: 100%; }\n/* clip, nao hidden: hidden faria de body um contexto de rolagem e a\n   topbar sticky deixaria de grudar no topo. */\nimg { max-width: 100%; height: auto; display: block; }\na { text-decoration: none; color: inherit; }\nul { list-style: none; }\n\n/* ===================== TOKENS ===================== */\n:root {\n  --bg:        #070a14;\n  --bg-2:      #0b0f1d;\n  --surface:   #101627;\n  --surface-2: #141c30;\n  --border:    #1f2940;\n  --border-lt: #2a3552;\n  --text:      #F4F6FB;\n  --muted:     #9aa6be;\n  --muted-2:   #6c7790;\n  /* accent champagne/ouro sóbrio — patrimonial premium */\n  --gold:      #c9a24b;\n  --gold-lt:   #e8cf8f;\n  --gold-dk:   #a07f2e;\n  --navy-glow: #1b3a6b;\n  --grad-gold: linear-gradient(135deg, #e8cf8f 0%, #c9a24b 55%, #a07f2e 100%);\n  --grad-navy: linear-gradient(160deg, #0b1226 0%, #070a14 100%);\n  --whatsapp:  #25D366;\n  --whatsapp-dk: #1da851;\n  --radius:    14px;\n  --radius-lg: 22px;\n  --maxw:      1200px;\n  --shadow:    0 20px 60px rgba(0,0,0,.45);\n  --shadow-gold: 0 10px 40px rgba(201,162,75,.18);\n}\n\nbody {\n  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;\n  background: var(--bg);\n  color: var(--text);\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ===================== UTIL ===================== */\n.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }\n.serif { font-family: 'Cormorant Garamond', serif; }\n.gold-text {\n  background: var(--grad-gold);\n  -webkit-background-clip: text; background-clip: text;\n  -webkit-text-fill-color: transparent; color: var(--gold-lt);\n}\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 9px;\n  font-size: .74rem; font-weight: 600; letter-spacing: .18em;\n  text-transform: uppercase; color: var(--gold);\n  margin-bottom: 18px;\n}\n.eyebrow::before {\n  content: ''; width: 26px; height: 1px;\n  background: linear-gradient(90deg, var(--gold), transparent);\n}\n.section { padding: 78px 0; position: relative; }\n.section-sm { padding: 56px 0; }\n\nh1, h2, h3 { line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }\n.h2 { font-size: 1.95rem; margin-bottom: 18px; }\n.lead { color: var(--muted); font-size: 1.05rem; max-width: 60ch; }\n\n/* ===================== REVEAL ===================== */\n.reveal { opacity: 0; transform: translateY(34px); transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); }\n.reveal.visible { opacity: 1; transform: translateY(0); }\n.reveal.d1 { transition-delay: .08s; }\n.reveal.d2 { transition-delay: .16s; }\n.reveal.d3 { transition-delay: .24s; }\n.reveal.d4 { transition-delay: .32s; }\n\n/* ===================== PROGRESS BAR ===================== */\n#progressBar {\n  position: fixed; top: 0; left: 0; height: 3px; width: 0%;\n  background: var(--grad-gold); z-index: 1000;\n  box-shadow: 0 0 12px rgba(201,162,75,.6);\n  transition: width .1s linear;\n}\n\n/* ===================== TOPBAR ===================== */\n.topbar {\n  position: sticky; top: 0; z-index: 900;\n  background: rgba(7,10,20,.82);\n  backdrop-filter: blur(14px);\n  border-bottom: 1px solid var(--border);\n}\n.topbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; max-width: var(--maxw); margin: 0 auto; }\n.topbar-logo { height: 38px !important; width: auto !important; max-width: 220px !important; max-height: 38px !important; opacity: .96; }\n.topbar-cta {\n  display: inline-flex; align-items: center; gap: 7px;\n  font-size: .8rem; font-weight: 700; color: var(--text);\n  border: 1px solid var(--border-lt); padding: 9px 15px; border-radius: 100px;\n  transition: all .25s;\n}\n.topbar-cta svg { width: 15px; height: 15px; }\n.topbar-cta:hover { border-color: var(--gold); color: var(--gold-lt); }\n.topbar-cta .lbl-full { display: none; }\n@media (min-width: 560px) { .topbar-cta .lbl-full { display: inline; } .topbar-cta .lbl-short { display: none; } }\n\n/* ===================== BTN WHATSAPP ===================== */\n.btn-wa {\n  display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n  background: var(--whatsapp); color: #04210f;\n  font-family: 'Plus Jakarta Sans', sans-serif;\n  font-weight: 800; font-size: .92rem; line-height: 1.25;\n  padding: 16px 26px; border-radius: 100px;\n  white-space: normal; text-align: center;\n  box-shadow: 0 8px 28px rgba(37,211,102,.32);\n  transition: transform .22s, box-shadow .22s, background .22s;\n  position: relative; overflow: hidden;\n}\n.btn-wa svg { width: 21px; height: 21px; flex-shrink: 0; }\n.btn-wa:hover { background: var(--whatsapp-dk); transform: translateY(-2px); box-shadow: 0 12px 36px rgba(37,211,102,.42); }\n.btn-wa::after {\n  content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;\n  background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);\n  transform: skewX(-20deg); animation: shine 3.6s ease-in-out infinite;\n}\n@keyframes shine { 0%,60% { left: -100%; } 100% { left: 160%; } }\n.btn-gold {\n  display: inline-flex; align-items: center; justify-content: center; gap: 9px;\n  background: var(--grad-gold); color: #1a1305;\n  font-weight: 800; font-size: .92rem; padding: 15px 26px; border-radius: 100px;\n  box-shadow: var(--shadow-gold); transition: transform .22s, box-shadow .22s;\n}\n.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 14px 44px rgba(201,162,75,.3); }\n@media (min-width: 768px) { .btn-wa, .btn-gold { font-size: 1rem; padding: 18px 34px; } }\n\n/* ===================== HERO ===================== */\n#hero { position: relative; overflow: hidden; background: var(--grad-navy); }\n.hero-veil {\n  position: absolute; inset: 0; z-index: 1;\n  background:\n    radial-gradient(120% 90% at 85% 80%, rgba(27,58,107,.5) 0%, transparent 55%),\n    linear-gradient(180deg, rgba(7,10,20,.55) 0%, rgba(7,10,20,.82) 100%);\n}\n/* SVG grid pattern */\n.hero-grid { position: absolute; inset: 0; z-index: 1; opacity: .5; }\n.hero-inner { position: relative; z-index: 3; padding: 40px 0 56px; }\n.hero-grid-layout { display: grid; grid-template-columns: 1fr; gap: 30px; align-items: center; }\n\n.hero-h1 { font-size: 2.15rem; line-height: 1.1; margin-bottom: 18px; }\n.hero-h1 .ln { display: block; }\n.hero-sub { color: var(--muted); font-size: 1.06rem; margin-bottom: 26px; max-width: 52ch; }\n.hero-cta-row { display: flex; flex-direction: column; gap: 14px; margin-bottom: 26px; }\n.hero-cta-row .btn-wa { width: 100%; }\n\n.trust-row { display: flex; flex-wrap: wrap; gap: 14px 20px; padding-top: 8px; border-top: 1px solid var(--border); }\n.trust-item { display: flex; align-items: center; gap: 9px; font-size: .82rem; color: var(--muted); }\n.trust-item svg { width: 20px; height: 20px; color: var(--gold); flex-shrink: 0; }\n.trust-item b { color: var(--text); font-weight: 700; }\n\n@media (min-width: 900px) {\n  .hero-grid-layout { grid-template-columns: 1fr; gap: 0; max-width: 860px; margin: 0 auto; text-align: center; }\n  .hero-h1 { font-size: 3.4rem; }\n  .hero-sub { margin-left: auto; margin-right: auto; }\n  .hero-cta-row { flex-direction: row; flex-wrap: wrap; justify-content: center; }\n  .hero-cta-row .btn-wa { width: auto; }\n  .trust-row { justify-content: center; }\n  .hero-inner { padding: 90px 0 96px; }\n}\n\n/* ===================== STAT STRIP ===================== */\n.stat-strip { background: var(--bg-2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }\n.stat-grid { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--border); }\n.stat-cell { background: var(--bg-2); padding: 26px 18px; text-align: center; }\n.stat-num { font-size: 2rem; font-weight: 800; line-height: 1; margin-bottom: 7px; }\n.stat-lbl { font-size: .76rem; color: var(--muted); letter-spacing: .04em; }\n@media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } .stat-num { font-size: 2.4rem; } }\n\n/* ===================== PROBLEMA / SITUAÇÕES ===================== */\n.sit-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 34px; }\n.sit-card {\n  background: linear-gradient(165deg, var(--surface) 0%, var(--bg-2) 100%);\n  border: 1px solid var(--border); border-radius: var(--radius);\n  padding: 24px 22px; position: relative; overflow: hidden;\n  transition: border-color .3s, transform .3s;\n}\n.sit-card::before {\n  content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 0;\n  background: var(--grad-gold); transition: height .4s ease;\n}\n.sit-card:hover { border-color: var(--border-lt); transform: translateY(-3px); }\n.sit-card:hover::before { height: 100%; }\n.sit-ico { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border-lt); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }\n.sit-ico svg { width: 24px; height: 24px; color: var(--gold); }\n.sit-card h3 { font-size: 1.08rem; margin-bottom: 9px; }\n.sit-card p { color: var(--muted); font-size: .94rem; }\n@media (min-width: 700px) { .sit-grid { grid-template-columns: 1fr 1fr; } }\n@media (min-width: 1000px) { .sit-grid { grid-template-columns: repeat(3, 1fr); } }\n\n/* ===================== MODALIDADES (tabs/cards) ===================== */\n.mod-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 34px; }\n.mod-card {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--radius); padding: 26px 22px; position: relative;\n  transition: transform .3s, box-shadow .3s, border-color .3s;\n}\n.mod-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--gold-dk); }\n.mod-num { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; font-weight: 700; color: var(--gold-dk); line-height: 1; opacity: .5; }\n.mod-card h3 { font-size: 1.14rem; margin: 10px 0; }\n.mod-card p { color: var(--muted); font-size: .92rem; }\n@media (min-width: 700px) { .mod-grid { grid-template-columns: 1fr 1fr; } }\n@media (min-width: 1050px) { .mod-grid { grid-template-columns: repeat(3, 1fr); } }\n\n/* ===================== PROCESSO (timeline) ===================== */\n.proc-wrap { margin-top: 38px; position: relative; }\n.proc-step { display: grid; grid-template-columns: auto 1fr; gap: 20px; padding-bottom: 34px; position: relative; }\n.proc-step:last-child { padding-bottom: 0; }\n.proc-line { position: absolute; left: 23px; top: 48px; bottom: -6px; width: 2px; background: linear-gradient(180deg, var(--gold-dk), var(--border)); }\n.proc-step:last-child .proc-line { display: none; }\n.proc-dot {\n  width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;\n  background: var(--surface-2); border: 1.5px solid var(--gold-dk);\n  display: flex; align-items: center; justify-content: center;\n  font-weight: 800; color: var(--gold-lt); font-size: 1.05rem; z-index: 2;\n}\n.proc-body { padding-top: 6px; }\n.proc-body h3 { font-size: 1.1rem; margin-bottom: 6px; }\n.proc-body p { color: var(--muted); font-size: .93rem; }\n\n/* ===================== AUTORIDADE ===================== */\n#autoridade { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }\n.auth-layout { display: grid; grid-template-columns: 1fr; gap: 36px; align-items: center; }\n.auth-photo-wrap { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-lt); }\n.auth-photo { width: 100%; display: block; }\n.auth-photo-wrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(7,10,20,.7) 100%); }\n.auth-points { display: grid; gap: 18px; margin-top: 26px; }\n.auth-point { display: grid; grid-template-columns: auto 1fr; gap: 15px; }\n.auth-check { width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border-lt); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n.auth-check svg { width: 21px; height: 21px; color: var(--gold); }\n.auth-point h3 { font-size: 1.02rem; margin-bottom: 3px; }\n.auth-point p { color: var(--muted); font-size: .9rem; }\n@media (min-width: 900px) { .auth-layout { grid-template-columns: .82fr 1.18fr; gap: 48px; } }\n\n/* ===================== FAIXA LEGAL (urgência real) ===================== */\n.legal-band { position: relative; overflow: hidden; border-radius: var(--radius-lg); border: 1px solid var(--gold-dk); background: linear-gradient(135deg, rgba(201,162,75,.08), rgba(7,10,20,.4)); padding: 34px 26px; }\n.legal-band .eyebrow { color: var(--gold-lt); }\n.legal-band h2 { font-size: 1.5rem; margin-bottom: 12px; }\n.legal-band p { color: var(--muted); font-size: .98rem; max-width: 64ch; }\n\n/* ===================== FAQ ===================== */\n.faq-list { margin-top: 34px; display: grid; gap: 12px; }\n.faq-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .3s; }\n.faq-item.open { border-color: var(--gold-dk); }\n.faq-q { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; cursor: pointer; font-weight: 700; font-size: 1rem; }\n.faq-q .ico { width: 26px; height: 26px; flex-shrink: 0; position: relative; transition: transform .3s; }\n.faq-q .ico::before, .faq-q .ico::after { content: ''; position: absolute; background: var(--gold); border-radius: 2px; transition: .3s; }\n.faq-q .ico::before { top: 12px; left: 5px; width: 16px; height: 2px; }\n.faq-q .ico::after { top: 5px; left: 12px; width: 2px; height: 16px; }\n.faq-item.open .ico::after { transform: rotate(90deg); opacity: 0; }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .4s ease; }\n.faq-a-inner { padding: 0 22px 22px; color: var(--muted); font-size: .94rem; }\n.faq-item.open .faq-a { max-height: 320px; }\n\n/* ===================== CTA FINAL ===================== */\n#cta-final { position: relative; overflow: hidden; }\n.cta-veil { position: absolute; inset: 0; z-index: 1; background: radial-gradient(80% 80% at 50% 50%, rgba(27,58,107,.4), rgba(7,10,20,.88)); }\n.cta-final-inner { position: relative; z-index: 3; text-align: center; padding: 30px 0; }\n.cta-final-inner h2 { font-size: 2rem; margin-bottom: 16px; }\n.cta-final-inner .lead { margin: 0 auto 30px; }\n.cta-final-inner .btn-wa { font-size: 1.05rem; padding: 19px 40px; }\n@media (min-width: 768px) { .cta-final-inner h2 { font-size: 2.6rem; } }\n\n/* ===================== FOOTER ===================== */\nfooter { background: var(--bg); border-top: 1px solid var(--border); padding: 46px 0 30px; }\n.foot-grid { display: grid; grid-template >\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== STAT STRIP ===================== -->\n<section id=\"stat-strip\" class=\"stat-strip\">\n  <div class=\"wrap\">\n    <div class=\"stat-grid\">\n      <div class=\"stat-cell reveal\">\n        <div class=\"stat-num gold-text\">+15<\u002Fdiv>\n        <div class=\"stat-lbl\">Anos de experiência<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-cell reveal d1\">\n        <div class=\"stat-num gold-text\">3<\u002Fdiv>\n        <div class=\"stat-lbl\">Modalidades de usucapião<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-cell reveal d2\">\n        <div class=\"stat-num gold-text\">100%<\u002Fdiv>\n        <div class=\"stat-lbl\">Foco em regularização<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SITUAÇÕES (Problema/Empatia) ===================== -->\n<section class=\"section\" id=\"situacoes\">\n  <div class=\"wrap\">\n    <div class=\"reveal\" style=\"max-width:62ch;\">\n      <span class=\"eyebrow\">Seu caso pode ser um destes<\u002Fspan>\n      <h2 class=\"h2\">Quando o imóvel é seu, mas o papel não diz isso<\u002Fh2>\n      <p class=\"lead\">Muita gente usa, cuida e paga as contas de um \nimóvel há anos — mas, no cartório, a propriedade nunca foi colocada no \nnome certo. Veja se alguma destas situações é parecida com a sua.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"sit-grid\">\n      <div class=\"sit-card reveal\">\n        <div class=\"sit-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Fazenda comprada no aperto de mão<\u002Fh3>\n        <p>A terra produz, está com a família há décadas, mas a matrícula nunca foi aberta ou nunca saiu do nome do antigo dono.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sit-card reveal d1\">\n        <div class=\"sit-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M9 8h6M9 12h6M9 16h4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Imóvel de falecido sem inventário<\u002Fh3>\n        <p>O pai, a mãe ou um parente faleceu, o imóvel continua com a \nfamília, mas o inventário nunca foi feito e a propriedade ficou travada.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sit-card reveal d2\">\n        <div class=\"sit-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M12 3l9 4.5v9L12 21l-9-4.5v-9L12 3z\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 12v9M3 7.5l9 4.5 9-4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Escritura que nunca foi registrada<\u002Fh3>\n        <p>Você tem contrato, recibo ou escritura — mas o cartório diz que isso sozinho não basta para colocar o imóvel no seu nome.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sit-card reveal\">\n        <div class=\"sit-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M16 4l5 5M21 4l-5 5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Imóvel no nome de quem você não localiza<\u002Fh3>\n        <p>A matrícula está em nome de uma pessoa que ninguém encontra mais — e isso impede a venda, a garantia ou a transmissão.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sit-card reveal d1\">\n        <div class=\"sit-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"8\" width=\"18\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M7 8V6a5 5 0 0110 0v2M12 13v3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Empresa em imóvel próprio não registrado<\u002Fh3>\n        <p>A empresa ocupa o galpão ou a sede há muitos anos, mas o imóvel nunca entrou formalmente no patrimônio dela.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sit-card reveal d2\">\n        <div class=\"sit-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 10l8-6 8 6M6 9v11h12V9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M10 20v-5h4v5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Loteamento com problema no registro<\u002Fh3>\n        <p>Você comprou de boa-fé, paga IPTU há anos, mas o loteamento tinha um defeito registral lá atrás que travou tudo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"reveal d2\" style=\"margin-top:36px; text-align:center;\">\n      <a class=\"btn-wa\" href=\"https://wa.me/5511910144241?text=Ol%C3%A1%2C%20preciso%20regularizar/atualizar%20a%20documenta%C3%A7%C3%A3o%20de%20um%20im%C3%B3vel%2C%20pode%20me%20ajudar%3F\" target=\"_blank\" rel=\"noopener\">\n        <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.6.2-.2.3-.7.9-.8 1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5 0-.1-.6-1.5-.9-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4 0 1.4 1 2.8 1.2 3 .1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z\"><\u002Fpath><path d=\"M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.5 0-3-.4-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3C4.4 14.9 4 13.5 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8z\"><\u002Fpath><\u002Fsvg>\n        Me identifiquei com uma situação. Quero falar\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== MODALIDADES ===================== -->\n<section class=\"section\" id=\"modalidades\" style=\"background:linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%);\">\n  <div class=\"wrap\">\n    <div class=\"reveal\" style=\"max-width:62ch;\">\n      <span class=\"eyebrow\">Entenda o caminho<\u002Fspan>\n      <h2 class=\"h2\">A usucapião reconhece o que já é seu na prática<\u002Fh2>\n      <p class=\"lead\">Usucapião é o direito de ter a propriedade \nreconhecida quando você tem a posse de um imóvel por tempo prolongado, \nde forma pacífica e como dono. Existem caminhos diferentes conforme o \nseu caso.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"mod-grid\">\n      <div class=\"mod-card reveal\">\n        <div class=\"mod-num\">01<\u002Fdiv>\n        <h3>Usucapião Rural<\u002Fh3>\n        <p>Para quem ocupa e produz em área rural por anos. Pode \nreconhecer a propriedade da terra usada pela família, mesmo sem registro\n formal no cartório.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mod-card reveal d1\">\n        <div class=\"mod-num\">02<\u002Fdiv>\n        <h3>Usucapião Urbana<\u002Fh3>\n        <p>Para imóveis na cidade — casa, apartamento, terreno, ponto \ncomercial — ocupados de forma contínua e sem disputa por período \nprolongado.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mod-card reveal d2\">\n        <div class=\"mod-num\">03<\u002Fdiv>\n        <h3>Usucapião Extrajudicial<\u002Fh3>\n        <p>Em muitos casos, hoje o procedimento corre direto no cartório\n de registro de imóveis, sem ação judicial — com mais previsibilidade de\n prazo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"reveal d1\" style=\"margin-top:28px; padding:22px 24px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:flex; gap:14px; align-items:flex-start;\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c9a24b\" stroke-width=\"1.8\" style=\"width:26px;height:26px;flex-shrink:0;margin-top:2px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8h.01M11 12h1v4h1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <p style=\"color:var(--muted); font-size:.95rem;\">Qual caminho se \naplica ao seu imóvel depende de detalhes do seu caso — tempo de posse, \ndocumentos que você tem e situação da matrícula. Essa análise é o \nprimeiro passo do atendimento.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== PROCESSO ===================== -->\n<section class=\"section\" id=\"processo\">\n  <div class=\"wrap\">\n    <div class=\"reveal\" style=\"max-width:62ch;\">\n      <span class=\"eyebrow\">Como funciona o atendimento<\u002Fspan>\n      <h2 class=\"h2\">Um caminho claro, do diagnóstico à regularização<\u002Fh2>\n      <p class=\"lead\">Você não precisa entender de lei para começar. \nPrecisa de alguém que organize a situação e mostre o caminho certo para o\n seu caso.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"proc-wrap\">\n      <div class=\"proc-step reveal\">\n        <div class=\"proc-dot\">1<\u002Fdiv><div class=\"proc-line\"><\u002Fdiv>\n        <div class=\"proc-body\">\n          <h3>Conversa inicial pelo WhatsApp<\u002Fh3>\n          <p>Você conta a situação do imóvel. De forma simples, \nentendemos o que existe hoje: documentos, tempo de posse e o que está \ntravando a regularização.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proc-step reveal d1\">\n        <div class=\"proc-dot\">2<\u002Fdiv><div class=\"proc-line\"><\u002Fdiv>\n        <div class=\"proc-body\">\n          <h3>Análise técnica do seu caso<\u002Fh3>\n          <p>Avaliamos qual modalidade de usucapião se aplica e se o \ncaminho extrajudicial (em cartório) é possível para a sua situação \nespecífica.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proc-step reveal d2\">\n        <div class=\"proc-dot\">3<\u002Fdiv><div class=\"proc-line\"><\u002Fdiv>\n        <div class=\"proc-body\">\n          <h3>Plano de regularização<\u002Fh3>\n          <p>Você recebe a orientação sobre os próximos passos, os \ndocumentos necessários e como o processo será conduzido — com \nprevisibilidade.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proc-step reveal d3\">\n        <div class=\"proc-dot\">4<\u002Fdiv>\n        <div class=\"proc-body\">\n          <h3>Acompanhamento até o registro<\u002Fh3>\n          <p>Conduzimos o procedimento com foco em colocar o imóvel no nome certo, na matrícula, de forma definitiva e segura.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== AUTORIDADE ===================== -->\n<section class=\"section\" id=\"autoridade\">\n  <div class=\"wrap\">\n    <div class=\"auth-layout\">\n      <div class=\"auth-photo-wrap reveal\">\n        <img id=\"authPhoto\" class=\"auth-photo\" alt=\"Sócios do NCM Advogados\" decoding=\"async\" src=\"b8e34a51-7c29-4d60-8f13-6a95c2d70e4b\">\n      <\u002Fdiv>\n      <div class=\"auth-copy reveal d1\">\n        <span class=\"eyebrow\">Por que o NCM Advogados<\u002Fspan>\n        <h2 class=\"h2\">Direito imobiliário e patrimonial é o nosso terreno<\u002Fh2>\n        <p class=\"lead\" style=\"margin-bottom:6px;\">O NCM — Nunes \nCollares Miguel Advogados atua na regularização de imóveis e na \norganização de patrimônio para famílias, produtores rurais e empresas em\n todo o Centro-Sul do Brasil.<\u002Fp>\n\n        <div class=\"auth-points\">\n          <div class=\"auth-point\">\n            <div class=\"auth-check\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div><h3>Foco em usucapião e regularização<\u002Fh3><p>Não somos generalistas. Trabalhamos especificamente com a regularização de imóveis e suas modalidades.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"auth-point\">\n            <div class=\"auth-check\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div><h3>Experiência com casos do agro e patrimoniais<\u002Fh3><p>Entendemos a realidade de quem tem terra, imóvel de família ou patrimônio que precisa ser organizado.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"auth-point\">\n            <div class=\"auth-check\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div><h3>Caminho extrajudicial sempre que possível<\u002Fh3><p>Buscamos a via mais rápida e previsível para o seu caso, evitando anos de processo quando há alternativa em cartório.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FAIXA LEGAL (urgência real) ===================== -->\n<section class=\"section-sm\" id=\"faixa-legal\">\n  <div class=\"wrap\">\n    <div class=\"legal-band reveal\">\n      <span class=\"eyebrow\">Por que vale resolver agora<\u002Fspan>\n      <h2 class=\"serif\">Regras mudaram e o tempo conta a seu favor — até certo ponto<\u002Fh2>\n      <p>A Lei 14.382/2022 tornou a usucapião em cartório mais ágil, e o\n Decreto 12.689/2025 fixou novos prazos para o georreferenciamento de \nimóveis rurais. Cada ano de posse fortalece o seu direito, mas \npendências de registro tendem a ficar mais complexas com o tempo — \nespecialmente quando envolvem herança, venda ou acesso a crédito. \nEntender sua situação cedo evita que um problema simples vire um \nproblema caro.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FAQ ===================== -->\n<section class=\"section\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"reveal\" style=\"max-width:62ch;\">\n      <span class=\"eyebrow\">Dúvidas frequentes<\u002Fspan>\n      <h2 class=\"h2\">O que as pessoas perguntam antes de começar<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"faq-list\">\n      <div class=\"faq-item reveal\">\n        <div class=\"faq-q\">Quanto tempo demora uma usucapião? <span class=\"ico\"><\u002Fspan><\u002Fdiv>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Depende do caso e do\n caminho. Quando é possível fazer pela via extrajudicial, em cartório, o\n prazo costuma ser bem menor do que o de um processo judicial. Na \nanálise inicial, conseguimos dar uma estimativa mais realista para a sua\n situação.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal d1\">\n        <div class=\"faq-q\">Preciso ir presencialmente ao escritório? <span class=\"ico\"><\u002Fspan><\u002Fdiv>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Não necessariamente.\n O atendimento começa pelo WhatsApp e boa parte do acompanhamento pode \nser feita a distância. Como atendemos todo o Centro-Sul, organizamos o \nprocesso de forma a facilitar para quem está em outra cidade.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal d2\">\n        <div class=\"faq-q\">Quais documentos eu preciso ter? <span class=\"ico\"><\u002Fspan><\u002Fdiv>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Varia conforme o \nimóvel. Em geral, ajuda ter qualquer comprovante de posse (contas, \ncontrato, recibo, escritura) e dados sobre há quanto tempo o imóvel é \nusado. Você não precisa organizar nada sozinho — orientamos exatamente o\n que reunir.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal\">\n        <div class=\"faq-q\">Tenho só um contrato de gaveta. Dá para regularizar? <span class=\"ico\"><\u002Fspan><\u002Fdiv>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Em muitos casos, \nsim. A usucapião existe justamente para situações em que o documento que\n você tem não é suficiente para abrir ou transferir a matrícula. A posse\n prolongada e pacífica é o que costuma sustentar o direito.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal d1\">\n        <div class=\"faq-q\">Qual a diferença entre via judicial e extrajudicial? <span class=\"ico\"><\u002Fspan><\u002Fdiv>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Na via \nextrajudicial, o procedimento corre diretamente no cartório de registro \nde imóveis, costuma ser mais rápido e previsível. A via judicial é \nnecessária em casos com disputa ou impugnação fundamentada. Avaliamos \nqual se aplica ao seu caso logo no início.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal d2\">\n        <div class=\"faq-q\">Como funciona a primeira conversa? <span class=\"ico\"><\u002Fspan><\u002Fdiv>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">É simples e sem \ncompromisso. Você clica no botão do WhatsApp, conta a situação do seu \nimóvel e tira suas primeiras dúvidas com um especialista. A partir daí, \nexplicamos os próximos passos.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reveal d1\" style=\"margin-top:30px; text-align:center;\">\n      <a class=\"btn-wa\" href=\"https://wa.me/5511910144241?text=Ol%C3%A1%2C%20preciso%20regularizar/atualizar%20a%20documenta%C3%A7%C3%A3o%20de%20um%20im%C3%B3vel%2C%20pode%20me%20ajudar%3F\" target=\"_blank\" rel=\"noopener\">\n        <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.6.2-.2.3-.7.9-.8 1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5 0-.1-.6-1.5-.9-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4 0 1.4 1 2.8 1.
